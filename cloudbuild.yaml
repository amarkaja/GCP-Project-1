steps:
  #build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-east1-docker.pkg.dev/my-devops-practice-490010/gcpdevops-dev/$SHORT_SHA', '.']

  #push the container image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'  
    args: ['push', 'us-east1-docker.pkg.dev/my-devops-practice-490010/gcpdevops-dev/$SHORT_SHA']

  - name: 'ubuntu'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        sed -i "s|us-east1-docker.pkg.dev/.*|us-east1-docker.pkg.dev/my-devops-practice-490010/gcpdevops-dev/$SHORT_SHA|g" gke.yml
  #deploy to GKE  
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - 'run'
      - '--filename=./gke.yml'
      - '--location=us-central1-a'
      - '--cluster=gcp-devops-project'
      - '--image=gcr.io/$PROJECT_ID/gcpdevops-dev'
      - '--namespace=gcp-devops-dev'

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

